name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install GTK4 (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev pkg-config

      - name: cargo test --workspace
        run: cargo test --workspace --verbose

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo build --workspace --release
        run: cargo build --workspace --release --verbose

      # Aurora is not published to crates.io (see the License section of
      # README.md — the workspace license is "Proprietary", not an OSI
      # license). This job's job is real verification + a GitHub Release,
      # not a Debian/APT package repository: no such repository exists for
      # this project, and an earlier version of this workflow fabricated
      # one (building/signing .deb packages, uploading to S3/CloudFront/
      # GitHub Pages, and even referencing a different GitHub org in its
      # release notes) despite none of that infrastructure existing. That
      # workflow was also not valid YAML.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Aurora v${{ steps.version.outputs.version }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the detailed, corrected release notes.

            Install as a git dependency (Aurora is not published to crates.io — see the License section of [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)):

            ```toml
            aurora-gtk = { git = "https://github.com/${{ github.repository }}", tag = "v${{ steps.version.outputs.version }}" }
            ```
          draft: false
          prerelease: false
          generate_release_notes: true
