[package]
name = "aurora-gtk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Aurora subsystems
aurora-tokens = { path = "../aurora-tokens" }
aurora-typography = { path = "../aurora-typography" }
aurora-motion = { path = "../aurora-motion" }
aurora-color = { path = "../aurora-color" }
aurora-sound = { path = "../aurora-sound" }
aurora-icons = { path = "../aurora-icons" }

# GTK4 bindings — this crate renders Aurora onto real GTK4 widgets and
# requires the system GTK4 library (>= 4.10) to be installed
# (e.g. `brew install gtk4` on macOS, `apt install libgtk-4-dev` on Debian/Ubuntu).
gtk4 = { version = "0.11", features = ["v4_12"] }
glib = "0.22"
