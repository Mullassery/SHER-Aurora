[package]
name = "aurora-gtk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Aurora subsystems
aurora-tokens = { path = "../aurora-tokens" }
aurora-typography = { path = "../aurora-typography" }
aurora-motion = { path = "../aurora-motion" }

# GTK4 bindings (optional - requires system GTK4)
# Uncomment when building against GTK4
# gtk4 = { version = "0.9", features = ["v4_10"] }
# glib = "0.19"
