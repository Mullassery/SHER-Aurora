[workspace]
members = [
    "crates/aurora-tokens",
    "crates/aurora-typography",
    "crates/aurora-color",
    "crates/aurora-motion",
    "crates/aurora-icons",
    "crates/aurora-sound",
    "crates/aurora-a11y",
    "crates/aurora-core",
    "crates/aurora-gtk",
    "crates/aurora-qt",
    "crates/aurora-web",
]

resolver = "2"

# `aurora-core`, `aurora-qt`, and `aurora-web` are intentional,
# clearly-labelled placeholder crates (see each crate's `lib.rs`) containing no
# real implementation. They stay workspace members so `cargo build -p
# aurora-qt` etc. still work, but are excluded from the *default* member set so
# a bare `cargo build` / `cargo test` / `cargo clippy` at the workspace root
# only compiles crates that actually implement something, instead of spending
# CI time building no-op crates and implying they are finished. README's
# "Project status" table documents all three as placeholder crates.
default-members = [
    "crates/aurora-tokens",
    "crates/aurora-typography",
    "crates/aurora-color",
    "crates/aurora-motion",
    "crates/aurora-icons",
    "crates/aurora-sound",
    "crates/aurora-a11y",
    "crates/aurora-gtk",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Mullassery/aurora"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
